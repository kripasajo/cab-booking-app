# RideFlow - run everything with:  docker compose up --build
# Then open http://localhost:3000

x-backend-env: &backend-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:-rideflow-demo-secret-key-change-me-in-production-0123456789}

x-backend-deps: &backend-deps
  kafka:
    condition: service_healthy

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rideflow
      POSTGRES_PASSWORD: rideflow
      POSTGRES_DB: rideflow
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Optional web UI to watch the Kafka topics and events: http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rideflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------- microservices ----------------
  user-service:
    build:
      context: ./backend
      args:
        SERVICE: user-service
    ports:
      - "8081:8081"
    environment:
      <<: *backend-env
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: rideflow
      DB_PASSWORD: rideflow
    depends_on:
      <<: *backend-deps
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend
      args:
        SERVICE: booking-service
    ports:
      - "8082:8082"
    environment:
      <<: *backend-env
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
      DB_USER: rideflow
      DB_PASSWORD: rideflow
      PRICING_URL: http://pricing-service:8084
    depends_on:
      <<: *backend-deps
      postgres:
        condition: service_healthy
      pricing-service:
        condition: service_started

  driver-service:
    build:
      context: ./backend
      args:
        SERVICE: driver-service
    ports:
      - "8083:8083"
    environment:
      <<: *backend-env
      REDIS_HOST: redis
      BOOKING_URL: http://booking-service:8082
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_BOTS: ${SIMULATOR_BOTS:-6}
      CITY_CENTER_LAT: ${CITY_CENTER_LAT:-12.9716}
      CITY_CENTER_LNG: ${CITY_CENTER_LNG:-77.5946}
    depends_on:
      <<: *backend-deps
      redis:
        condition: service_healthy

  pricing-service:
    build:
      context: ./backend
      args:
        SERVICE: pricing-service
    ports:
      - "8084:8084"
    environment:
      <<: *backend-env
      REDIS_HOST: redis
    depends_on:
      <<: *backend-deps
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE: notification-service
    ports:
      - "8085:8085"
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-deps

  # ---------------- frontend ----------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_CITY_CENTER_LAT: ${CITY_CENTER_LAT:-12.9716}
        VITE_CITY_CENTER_LNG: ${CITY_CENTER_LNG:-77.5946}
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - booking-service
      - driver-service
      - pricing-service
      - notification-service

volumes:
  pgdata:
