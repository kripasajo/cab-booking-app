server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: driver-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: driver-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.rideflow.*"

app:
  booking-url: ${BOOKING_URL:http://localhost:8082}
  jwt:
    secret: ${JWT_SECRET:rideflow-demo-secret-key-change-me-in-production-0123456789}
  security:
    public-paths: ""
  matching:
    radius-km: 5
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    bots: ${SIMULATOR_BOTS:6}
    center-lat: ${CITY_CENTER_LAT:12.9716}
    center-lng: ${CITY_CENTER_LNG:77.5946}
    step-km: 0.08
