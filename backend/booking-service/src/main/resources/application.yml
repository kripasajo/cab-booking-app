server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookingdb}
    username: ${DB_USER:rideflow}
    password: ${DB_PASSWORD:rideflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.rideflow.*"

app:
  pricing-url: ${PRICING_URL:http://localhost:8084}
  jwt:
    secret: ${JWT_SECRET:rideflow-demo-secret-key-change-me-in-production-0123456789}
  security:
    public-paths: ""
