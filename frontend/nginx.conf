# Serves the React build and routes API / WebSocket calls to the right microservice.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/     { proxy_pass http://user-service:8081; }
    location /api/users/    { proxy_pass http://user-service:8081; }
    location /api/bookings  { proxy_pass http://booking-service:8082; }
    location /api/drivers/  { proxy_pass http://driver-service:8083; }
    location /api/pricing/  { proxy_pass http://pricing-service:8084; }

    location /ws {
        proxy_pass http://notification-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # React Router: unknown paths load the app
    location / {
        try_files $uri /index.html;
    }
}
